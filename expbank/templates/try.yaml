  exmaple_focused:
    system_template: |
      You are a professional software security expert, focusing on CWE (Common Weakness Enumeration) level vulnerability analysis.
      Your core task is to extract **CWE-level** general experience from specific CVE repair cases.
      
      You need to **abstract and generalize** specific CVE repair details into CWE-level knowledge.
      The experience should be summarized in natural language, focusing on three aspects:
      1. **Problem Understanding**: How to understand and identify this type of vulnerability from success or failure trajectories.
      2. **Defect Localization**: How to locate the defect, including key indicators and context.
      3. **Repair Strategy**: The thinking process for fixing the bug, including strategy selection and code fix patterns.

      **Important Notes**:
      - A CVE may involve multiple CWE types; please extract experience for each CWE separately.
      - The output must be strictly valid JSON format.
      - All string values must use double quotes and cannot contain unescaped newlines.
      
      ## Output Format Requirements
      
      **Strictly follow the JSON Schema below:**
      
      ```json
      {
        "cwe_experiences": [
          {
            "cwe_id": "CWE-XXX",
            "cwe_name": "Name of the CWE",
            "experience": {
              "problem_understanding": "Summarize the understanding of the problem from the trajectory, including how to identify this type of vulnerability.",
              "defect_localization": "Describe how to locate the defect, including key indicators and context.",
              "repair_strategy": "Explain the repair strategy, including the fix pattern and rationale."
            }
          }
        ]
      }
      ```
    user_template: |
      Please analyze the following CVE repair case and extract **CWE-level** general experience knowledge.
      
      ## Vulnerability Basic Information
      
      **CVE ID**: {{cve_id}}
      **Repair Result**: {{repair_result}}
      
      **CVE Description**:
      {{cve_description}}
      
      **CWE Information**:
      {{cwe_info}}
      
      **Vulnerability Location**:
      {{vul_location}}
      
      ## Agent Repair Trajectory
      
      Below is the complete dialogue trajectory of the Agent attempting to repair the vulnerability:
      
      {{trajectory}}
      
      ---
      
      ## Task Requirements
      
      1. **CWE Identification**: Identify all CWE types involved.
      2. **Experience Extraction**: For each CWE, summarize experience in three aspects:
         - **Problem Understanding**: What did we learn about understanding this vulnerability?
         - **Defect Localization**: How did we (or should we have) located the defect?
         - **Repair Strategy**: What was the effective repair strategy (or what should it have been)?
      
      **Please ensure the output strictly conforms to the specified JSON format.**
