extraction_settings:
  # Trajectory preprocessing options
  trajectory_preprocessing:
    max_trajectory_length: 50000  # Maximum trajectory length (characters)
    truncation_strategy: "smart"  # smart: keep key parts; head: keep the beginning; tail: keep the end
    include_tool_results: true    # Whether to include tool call results
    filter_roles: ["system", "user", "assistant"]  # Roles to retain
  
  # Output postprocessing options
  output_postprocessing:
    validate_json: true           # Validate JSON output format
    extract_confidence: true      # Extract confidence information
    generate_summary: true        # Generate an experience summary
